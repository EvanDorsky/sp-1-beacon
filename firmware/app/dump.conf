# DEV-ONLY overlay config: build the read-only CYW20706 flash dumper.
# Use with fw.sh dump, which also pulls in download.overlay (uart0 flow off).
#   ./scripts/fw.sh dump        # build the dumper (needs NO cybt_blobs.h)
#   ./scripts/fw.sh monitordump # host receiver (writes the .bin, checks CRC)
CONFIG_SP1_BT_DUMP=y
CONFIG_CRC=y
# The dump has no USB-MIDI, so it doesn't need the CDC's dedicated TX workqueue
# (the normal build adds it to avoid MIDI/stack contention). Dropping it here
# makes uart_poll_out flush through the shared path, which drains reliably while
# the dump loop yields (k_msleep) — the dedicated workqueue was starving.
CONFIG_USBD_CDC_ACM_WORKQUEUE=n
