# Link the vector table EXACTLY at 0x20000, where the TE bootloader runs the
# app. The marisko board files set BOTH CONFIG_FLASH_LOAD_OFFSET=0x20000 (image
# base) and a default CONFIG_ROM_START_OFFSET=0x20000 (an MCUboot-style header
# pad INSIDE the image); stacked they linked the vectors at 0x40000 and the
# flashed app never booted (dark device, DFU still fine — bench-diagnosed).
# Zero the pad; FLASH_LOAD_OFFSET alone places the image. fw.sh's bin step
# verifies _vector_table == 0x20000 before packaging.
CONFIG_ROM_START_OFFSET=0x0

CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_PM=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_GPIO=y

# The sp1 board defconfig (marisko, a stem-player firmware) enables the audio
# codec's I2C + I2S. The beacon firmware touches neither — keep them out of
# the image.
CONFIG_I2C=n
CONFIG_I2S=n

# LED PWM: all 8 LEDs (pwm2=track, pwm3=side) driven via led.c at a global
# brightness. The nrfx PWM driver is auto-selected for the &pwm2/&pwm3 nodes
# enabled in app.overlay.
CONFIG_PWM=y

# SAADC: the two button ladders + the battery divider (controls.c).
CONFIG_ADC=y

# USB on the device_next stack via the sample_usbd helper: a single CDC ACM
# function carrying the console (chosen zephyr,console in app.overlay).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=2048
# The app owns the single usbd context (sample_usbd_init_device + usbd_enable);
# do NOT let the CDC SYS_INIT build a second private context that fights for
# the controller.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# Interrupt-driven UART: the CDC console uses it, and module_link.c's UART0 RX
# (the CYW20706 WICED-HCI link) is interrupt-driven too.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_HWINFO=y

# USB device identity for the sample_usbd helper. Nordic VID (as feldd, so the
# same WebSerial filter finds it); a fresh PID distinct from feldd's composites
# (0x5211 CDC+MIDI, 0x5212 +HID) since this device is CDC-only.
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 Beacon"
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5213

# device_next USBD init (descriptor build + class registration) wants headroom
# over the minimum; 4 KB is comfortable for this small app (feldd needed 6 KB
# only for its config-protocol stack frames).
CONFIG_MAIN_STACK_SIZE=4096
